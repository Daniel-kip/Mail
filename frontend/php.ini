; Mailvora frontend runtime settings (production and local).
expose_php=Off
memory_limit=256M
max_execution_time=150
max_input_time=150

; Webmail attachments: up to 20 MB per message plus form overhead.
file_uploads=On
upload_max_filesize=21M
post_max_size=26M
max_file_uploads=20

; The app manages its own hardened session (see src/Session/NativeSession.php).
session.cookie_httponly=1
session.cookie_samesite=Lax
session.use_strict_mode=1
session.use_only_cookies=1

; OPcache: compile once, never re-check files in production.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0

display_errors=Off
log_errors=On
