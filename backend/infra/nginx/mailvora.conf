# Host Nginx edge for Mailvora on a VPS. Certificates come from certbot.
#
#   app.example.com         PHP web app: website, console, webmail, phone setup
#                           (frontend container, 127.0.0.1:8080). The PHP server
#                           talks to the API over the private Compose network;
#                           browsers never call the API directly.
#   api.example.com         Rust API for machine clients (scoped API keys).
#   autoconfig.example.com  Mail-client discovery served by the API
#                           (Thunderbird autoconfig, Outlook Autodiscover).
#   autoconfig.<customer>   Optional CNAMEs from customer domains. Thunderbird
#                           also tries plain http://autoconfig.<domain>, so the
#                           port-80 block below answers it without a certificate.
#
# Replace example.com hosts with PUBLIC_BASE_URL, PUBLIC_API_URL and AUTOCONFIG_HOST.

limit_req_zone $binary_remote_addr zone=mv_web:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mv_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=mv_api:20m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=mv_conn:10m;

upstream mailvora_web {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream mailvora_api {
    server 127.0.0.1:8088;
    keepalive 32;
}

# ── port 80: ACME, redirects, and autoconfig over HTTP ──────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com api.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name ~^autoconfig\. ;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /mail/config-v1.1.xml { proxy_pass http://mailvora_api; proxy_set_header Host $host; }
    location = /.well-known/autoconfig/mail/config-v1.1.xml { proxy_pass http://mailvora_api; proxy_set_header Host $host; }
    location / { return 404; }
}

# ── web app ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Webmail attachments: up to 20 MB per message.
    client_max_body_size 26m;
    client_body_timeout 60s;
    send_timeout 120s;
    limit_conn mv_conn 60;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 150s;

    # Credential endpoints: brute-force damping on top of the API's own limits.
    location ~ ^/(login|register|forgot-password|reset-password|mail/login|mail/forgot-password|mail/reset-password|mail/activate)$ {
        limit_req zone=mv_auth burst=10 nodelay;
        proxy_pass http://mailvora_web;
    }

    location /assets/ {
        proxy_pass http://mailvora_web;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_req zone=mv_web burst=80 nodelay;
        proxy_pass http://mailvora_web;
    }
}

# ── API for machine clients ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    client_max_body_size 16m;
    client_body_timeout 30s;
    send_timeout 60s;
    limit_conn mv_conn 50;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The API trusts X-Real-IP only when TRUST_PROXY_HEADERS=true.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 75s;

    # Mail-tier and browser-session endpoints are not for the public host.
    location /internal/ { return 404; }
    location /v1/webmail/ { return 404; }
    location /v1/admin/ { return 404; }

    location / {
        limit_req zone=mv_api burst=60 nodelay;
        proxy_pass http://mailvora_api;
    }
}

# ── mail-client discovery (HTTPS) ───────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name autoconfig.example.com autodiscover.example.com;

    ssl_certificate     /etc/letsencrypt/live/autoconfig.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autoconfig.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    location ~* ^/(mail/config-v1\.1\.xml|\.well-known/autoconfig/mail/config-v1\.1\.xml|autodiscover/autodiscover\.xml)$ {
        limit_req zone=mv_api burst=20 nodelay;
        proxy_pass http://mailvora_api;
    }
    location / { return 404; }
}
