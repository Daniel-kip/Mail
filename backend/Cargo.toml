[package]
name = "mailvora"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Multi-tenant email platform: transactional email API and hosted mailboxes"
publish = false

[[bin]]
name = "mailvora"
path = "src/main.rs"

[lib]
name = "mailvora"
path = "src/lib.rs"

# Versions are pinned to the newest patch of each crate's mature major line.
# See docs/DECISIONS.md (D-007) before bumping a major version.
[dependencies]
# HTTP
axum = { version = "0.8.9", features = ["macros", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "limit", "timeout", "request-id", "util", "catch-panic", "set-header"] }
tokio = { version = "1.47", features = ["full"] }
futures = "0.3"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate", "ipnetwork"] }

# Mail
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "dkim", "hostname", "pool"] }
mail-parser = "0.11"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
hickory-resolver = "0.24"

# Security / crypto
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
rsa = { version = "0.9", features = ["sha2", "pem"] }
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
subtle = "2.6"
base64 = "0.22"
hex = "0.4"
ammonia = "4"

# Templates
minijinja = { version = "2", features = ["builtins", "fuel"] }

# Outbound HTTP (webhooks)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization / utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
dotenvy = "0.15"
regex = "1"
once_cell = "1"
url = "2"
idna = "1"
ipnetwork = "0.20"
dashmap = "6"
bytes = "1"
mime = "0.3"
percent-encoding = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }

# Crypto (RSA key generation, Argon2) is unusably slow unoptimized; build
# dependencies with optimizations even in development. Our own crate stays
# at opt-level 0 for fast incremental builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
